# Compose file for Dokploy (or any host where other containers should use the pool).
#
# - Builds from source, so no registry access is needed.
# - Joins Dokploy's shared network: other Dokploy apps reach the pool at
#   http://USER:PASS@lanepool:8080 (or socks5h://...@lanepool:10001 for a pinned lane).
# - Nothing is published on the public interface. Ports are bound to the host's
#   loopback only, for SSH tunnels (dashboard: ssh -L 8000:127.0.0.1:8000 server).
# - Set the variables from .env.example in Dokploy's Environment tab.
services:
  lanepool:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${PROXY_PORT:-8080}:${PROXY_PORT:-8080}"
      - "127.0.0.1:${API_PORT:-8000}:${API_PORT:-8000}"
    networks:
      dokploy-network:
        aliases: [lanepool]
    tmpfs:
      - /run/lanepool:mode=0700,uid=10001,gid=10001
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  dokploy-network:
    external: true
