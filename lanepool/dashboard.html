<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lanepool</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1c1c1a; --muted: #6b6b66; --line: #e4e4df;
    --up: #1f8a4c; --down: #c23b2a; --wait: #b7791f; --accent: #2f5bd3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1d1d1b; --text: #ecece8; --muted: #9a9a93; --line: #2e2e2b;
      --up: #4cc27f; --down: #f0705f; --wait: #e0a94a; --accent: #7c9cff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .tile .k { color: var(--muted); font-size: 12px; }
  .tile .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  input, select { background: var(--panel); color: var(--text); border: 1px solid var(--line);
                  border-radius: 8px; padding: 7px 10px; font: inherit; }
  input { flex: 1; min-width: 180px; }
  .table { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  td.num { font-variant-numeric: tabular-nums; }
  code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--wait); }
  .s-up .dot, .s-running .dot { background: var(--up); }
  .s-down .dot, .s-restarting .dot { background: var(--down); }
  .s-backoff .dot { background: var(--muted); }
  .err { color: var(--muted); max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
  button { background: none; border: 1px solid var(--line); color: var(--accent); border-radius: 6px;
           padding: 3px 8px; font: inherit; font-size: 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1>lanepool</h1>
    <span class="sub" id="sub">loading…</span>
  </header>
  <section class="tiles" id="tiles"></section>
  <div class="bar">
    <input id="filter" placeholder="Filter by name, country, IP or port" aria-label="Filter lanes">
    <select id="status" aria-label="Status filter">
      <option value="">All statuses</option>
      <option>up</option><option>running</option><option>starting</option>
      <option>down</option><option>backoff</option><option>restarting</option>
    </select>
  </div>
  <div class="table">
    <table>
      <thead><tr>
        <th>#</th><th>Lane</th><th>Status</th><th>Port</th><th>Key</th><th>Exit IP</th>
        <th>Latency</th><th>Location</th><th>Restarts</th><th>Last error</th><th></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let data = null;

function render() {
  if (!data) return;
  const by = data.lanes_by_status;
  const up = (by.up || 0) + (by.running || 0);
  $("sub").textContent = `rotating proxy :${data.proxy_port} · strategy ${data.strategy} · ` +
    (data.healthy ? "healthy" : "unhealthy") + ` · up ${Math.floor(data.uptime_s / 60)} min`;
  $("tiles").innerHTML = [
    ["Lanes", data.lanes_total], ["Healthy", up], ["Unique exit IPs", data.unique_exit_ips],
    ["Down", (by.down || 0) + (by.restarting || 0)], ["Backing off", by.backoff || 0], ["Starting", by.starting || 0],
  ].map(([k, v]) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");

  const q = $("filter").value.trim().toLowerCase();
  const st = $("status").value;
  $("rows").innerHTML = data.lanes.filter((l) =>
    (!st || l.status === st) &&
    (!q || [l.name, l.country, l.country_code, l.location, l.exit_ip, l.port].join(" ").toLowerCase().includes(q))
  ).map((l) => `<tr>
      <td class="num">${l.index}</td>
      <td><code>${esc(l.name)}</code></td>
      <td class="s-${esc(l.status)}"><span class="dot"></span>${esc(l.status)}</td>
      <td class="num"><code>${l.port}</code></td>
      <td class="num">${l.key ?? "—"}</td>
      <td><code>${esc(l.exit_ip || "—")}</code></td>
      <td class="num">${l.latency_ms != null ? l.latency_ms + " ms" : "—"}</td>
      <td>${esc([l.location, l.country].filter(Boolean).join(", ") || l.endpoint || "—")}</td>
      <td class="num">${l.restarts}</td>
      <td class="err" title="${esc(l.last_error)}">${esc(l.last_error || "")}</td>
      <td><button data-lane="${esc(l.name)}" data-act="check">Check</button>
          <button data-lane="${esc(l.name)}" data-act="restart">Restart</button></td>
    </tr>`).join("");
}

async function load() {
  try {
    const r = await fetch("api/status", { cache: "no-store" });
    data = await r.json();
    render();
  } catch (e) {
    $("sub").textContent = "cannot reach lanepool: " + e.message;
  }
}

$("rows").addEventListener("click", async (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  b.disabled = true;
  await fetch(`api/lanes/${encodeURIComponent(b.dataset.lane)}/${b.dataset.act}`, { method: "POST" });
  setTimeout(load, 1500);
});
$("filter").addEventListener("input", render);
$("status").addEventListener("change", render);
load();
setInterval(load, 5000);
</script>
</body>
</html>
