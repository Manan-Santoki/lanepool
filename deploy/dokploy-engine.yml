# lanepool on Dokploy, part 2 of 2: the engine (VPN lanes + proxy).
#
# Dokploy compose service with compose path ./deploy/dokploy-engine.yml.
# Redeploy it only when engine code changes: every engine restart reconnects all
# lanes, and VPN providers throttle bursts of new sessions.
#
# Environment (Dokploy → Environment):
#   ENGINE_TOKEN      same value as the control service
#   CONTROL_URL       default http://lanepool-control:8000
#   TRUSTED_PROXIES   e.g. 10.0.1.0/24 (dokploy-network) when Traefik sends PROXY protocol
#
#   LANES_URL         optional: http://lanepool-lanes:9191 to use the separate
#                     lanes service (deploy/dokploy-lanes.yml); engine deploys
#                     then leave the tunnels connected. Empty = lanes run here.
#   LANES_TOKEN       same value as the lanes service (default: ENGINE_TOKEN)
#
# With lanes running here, the lanes that worked are kept in a volume and tried
# first after a restart, so a redeploy reconnects to known-good servers.
#
# On dokploy-network and lanepool-net the engine is "lanepool": other apps use
# lanepool:8080 (join the external lanepool-net network for that), control
# reaches its API at lanepool:9090. Create lanepool-net once (Dokploy →
# Networks, or docker network create lanepool-net) before deploying.
#
# qBittorrent on a separate qbit-egress network: add compose overlay
# deploy/dokploy-engine.qbit-egress.yml (see that file for Dokploy steps and
# the fixed proxy IP for qBittorrent). Base deploy is unchanged when the overlay
# is not used.
services:
  engine:
    build:
      context: ..
    image: lanepool:engine
    command: engine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      CONTROL_URL: ${CONTROL_URL:-http://lanepool-control:8000}
      ENGINE_TOKEN: ${ENGINE_TOKEN:?set ENGINE_TOKEN}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      LANES_URL: ${LANES_URL:-}
      LANES_TOKEN: ${LANES_TOKEN:-}
      LANES_STATE_FILE: /data/known-lanes.json
      LOG_LEVEL: ${LOG_LEVEL:-info}
      UDP_ADVERTISE_HOST: ${UDP_ADVERTISE_HOST:-lanepool}
      UDP_ADVERTISE_IP: ${UDP_ADVERTISE_IP:-}
      UDP_RELAY_PORT_MIN: ${UDP_RELAY_PORT_MIN:-30000}
      UDP_RELAY_PORT_MAX: ${UDP_RELAY_PORT_MAX:-30100}
    expose:
      - "30000-30100/udp"
    volumes:
      - engine-data:/data
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks:
      dokploy-network:
        aliases: [lanepool]
      # Shared with the apps that use the proxy (created in Dokploy), so they
      # need not join dokploy-network.
      lanepool-net:
        aliases: [lanepool]

volumes:
  engine-data:

networks:
  dokploy-network:
    external: true
  lanepool-net:
    external: true
