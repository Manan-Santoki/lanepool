# Public HTTPS proxy for lanepool behind Dokploy's Traefik.
#
# Copy to /etc/dokploy/traefik/dynamic/lanepool-proxy.yml (Traefik reloads it
# live) and replace proxy.example.com. The DNS record must point straight at the
# server (Cloudflare "DNS only"): Cloudflare's proxy doesn't forward CONNECT.
#
# Traefik terminates TLS with a Let's Encrypt certificate and passes the
# connection to the engine with a PROXY protocol header, so lanepool logs and
# per-user IP allowlists see the real client address. Set TRUSTED_PROXIES on the
# engine to the dokploy-network subnet (e.g. 10.0.1.0/24) for that to work.
# Clients use https://USER:PASS@proxy.example.com as their proxy URL.
tcp:
  routers:
    lanepool-proxy:
      entryPoints:
        - websecure
      rule: HostSNI(`proxy.example.com`)
      service: lanepool-proxy
      tls:
        certResolver: letsencrypt
  services:
    lanepool-proxy:
      loadBalancer:
        proxyProtocol:
          version: 2
        servers:
          - address: lanepool:8080
