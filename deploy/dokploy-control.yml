# lanepool on Dokploy, part 1 of 2: dashboard/API (control) + Postgres.
#
# Dokploy compose service with compose path ./deploy/dokploy-control.yml.
# Redeploying this never touches the VPN lanes; they live in the engine service
# (./deploy/dokploy-engine.yml), deployed separately.
#
# Environment (Dokploy → Environment):
#   LANEPOOL_SECRET, ENGINE_TOKEN, POSTGRES_PASSWORD   required
#   ADMIN_EMAIL, ADMIN_PASSWORD                         first admin (optional)
#   ENGINE_URL                                          default http://lanepool:9090
# Add a domain for service "control", port 8000.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lanepool
      POSTGRES_DB: lanepool
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lanepool"]
      interval: 5s
      retries: 20
    networks: [default]

  control:
    build:
      context: ..
    image: lanepool:control
    command: control
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DATABASE_URL: postgres://lanepool:${POSTGRES_PASSWORD}@db:5432/lanepool?sslmode=disable
      ENGINE_URL: ${ENGINE_URL:-http://lanepool:9090}
      LANEPOOL_SECRET: ${LANEPOOL_SECRET:?set LANEPOOL_SECRET}
      ENGINE_TOKEN: ${ENGINE_TOKEN:?set ENGINE_TOKEN}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # One-time import into an empty database (optional).
      SURFSHARK_PRIVATE_KEYS: ${SURFSHARK_PRIVATE_KEYS:-}
      LANES: ${LANES:-}
      COUNTRIES: ${COUNTRIES:-}
      PROXY_USER: ${PROXY_USER:-}
      PROXY_PASS: ${PROXY_PASS:-}
      PUBLIC_PROXY_HOST: ${PUBLIC_PROXY_HOST:-}
    depends_on:
      db: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks:
      default:
      dokploy-network:
        aliases: [lanepool-control]

volumes:
  db:

networks:
  dokploy-network:
    external: true
