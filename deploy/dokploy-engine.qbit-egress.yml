# Optional overlay for lanepool-engine on Dokploy: attach the engine to the
# external qBittorrent egress network with a stable IPv4 so qBittorrent can
# reach TCP :8080 and UDP relay ports 30000–30100 directly (no nginx UDP relay).
#
# Prerequisites (once, on the Docker host):
#   docker network create --subnet=10.200.19.0/24 qbit-egress
#   (qBittorrent and any legacy lanepool-gw nginx should already use this network.)
#
# Enable in Dokploy (engine compose service "lanepool-engine"):
#   1. Compose path: keep ./deploy/dokploy-engine.yml as the primary file.
#   2. Add a second compose file: ./deploy/dokploy-engine.qbit-egress.yml
#      (Dokploy → Compose → Additional compose files / override files), or use
#      the Command field (see README) to pass both -f files.
#   3. No UDP_ADVERTISE_* env change needed: this overlay sets
#      UDP_ADVERTISE_HOST=auto so ASSOCIATE replies use the TCP listener IP
#      each client connected to (qbit-egress vs dokploy-network). Override with
#      UDP_ADVERTISE_HOST or UDP_ADVERTISE_IP only if you need a fixed address.
#   4. Redeploy the engine only (same as without the overlay).
#
# qBittorrent (on qbit-egress): SOCKS5 proxy host 10.200.19.10 port 8080,
# user qbit (plain username, no session/country params). You can retire
# lanepool-gw nginx once this works.
#
# If qbit-egress does not exist, do not attach this file — base deploy is unchanged.
services:
  engine:
    environment:
      UDP_ADVERTISE_HOST: ${UDP_ADVERTISE_HOST:-auto}
      UDP_ADVERTISE_IP: ${UDP_ADVERTISE_IP:-}
    networks:
      qbit-egress:
        ipv4_address: ${QBIT_EGRESS_ENGINE_IP:-10.200.19.10}
        aliases:
          - lanepool-engine

networks:
  qbit-egress:
    external: true
