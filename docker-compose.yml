# lanepool: control (dashboard + API), engine (VPN lanes + proxy) and Postgres.
#   cp .env.example .env   # set LANEPOOL_SECRET, ENGINE_TOKEN, POSTGRES_PASSWORD
#   docker compose up -d
# Dashboard: http://127.0.0.1:8000   Proxy: 127.0.0.1:8080 (HTTP + SOCKS5)
x-lanepool: &lanepool
  image: ghcr.io/manan-santoki/lanepool:latest
  build: .
  restart: unless-stopped
  env_file: .env
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lanepool
      POSTGRES_DB: lanepool
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lanepool"]
      interval: 5s
      retries: 20

  control:
    <<: *lanepool
    command: control
    environment:
      DATABASE_URL: postgres://lanepool:${POSTGRES_PASSWORD}@db:5432/lanepool?sslmode=disable
      ENGINE_URL: http://engine:9090
    ports:
      - "${BIND_IP:-127.0.0.1}:${DASHBOARD_PORT:-8000}:8000"
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 15s

  engine:
    <<: *lanepool
    command: engine
    environment:
      CONTROL_URL: http://control:8000
    ports:
      - "${BIND_IP:-127.0.0.1}:${PROXY_PORT:-8080}:8080"
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/healthz"]
      interval: 15s

volumes:
  db:
